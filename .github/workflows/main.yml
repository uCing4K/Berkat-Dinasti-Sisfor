name: Deploy to cPanel via SSH

on:
  push:
    branches:
      - main # Otomatis berjalan setiap kali ada push ke branch main

jobs:
  deploy:
    name: 🚀 Deploy to Production via SSH
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Execute Remote Git Pull via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=== Memulai Deployment ke ex5.ucing4k.my.id ==="
            cd /home/ucie5797/public_html/ex5.ucing4k.my.id
            git fetch origin main
            git reset --hard origin/main
            echo "=== Deployment Berhasil! Versi terbaru aktif di https://ex5.ucing4k.my.id ==="
