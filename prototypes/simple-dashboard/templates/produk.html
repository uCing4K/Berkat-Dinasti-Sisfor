{% extends 'base.html' %}
{% block content %}
<div class="card p-3 mb-3">
    <h5 class="section-title">Tambah Produk</h5>
    <form method="post" action="{{ url_for('produk_add') }}" class="row g-2">
        <div class="col-md-3">
            <select name="id_kategori" class="form-select" required>
                <option value="">Pilih Kategori</option>
                {% for c in categories %}<option value="{{ c.id_kategori }}">{{ c.nama_kategori }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-3"><input name="nama_produk" class="form-control" placeholder="Nama produk" required></div>
        <div class="col-md-2"><input name="shelf_life" class="form-control" type="number" value="7" min="1"></div>
        <div class="col-md-2">
            <select name="status" class="form-select">
                <option value="tersedia">tersedia</option>
                <option value="tidak_tersedia">tidak_tersedia</option>
            </select>
        </div>
        <div class="col-md-2"><button class="btn btn-primary w-100">Simpan</button></div>
        <div class="col-12"><textarea name="deskripsi" class="form-control" placeholder="Deskripsi"></textarea></div>
    </form>
</div>

<div class="card p-3">
    <h5 class="section-title">Data Produk</h5>
    <table class="table table-striped table-hover">
        <thead><tr><th>ID</th><th>Nama</th><th>Kategori</th><th>Shelf Life</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody>
        {% for row in rows %}
            <tr>
                <td>{{ row.id_produk }}</td>
                <td>{{ row.nama_produk }}</td>
                <td>{{ row.nama_kategori }}</td>
                <td>{{ row.shelf_life }} hari</td>
                <td>{{ row.status }}</td>
                <td>
                    <details>
                        <summary>Edit</summary>
                        <form method="post" action="{{ url_for('produk_edit', produk_id=row.id_produk) }}" class="mt-2">
                            <input class="form-control mb-1" name="nama_produk" value="{{ row.nama_produk }}" required>
                            <select name="id_kategori" class="form-select mb-1">
                                {% for c in categories %}
                                    <option value="{{ c.id_kategori }}" {% if c.id_kategori == row.id_kategori %}selected{% endif %}>{{ c.nama_kategori }}</option>
                                {% endfor %}
                            </select>
                            <input class="form-control mb-1" name="shelf_life" type="number" value="{{ row.shelf_life }}">
                            <select name="status" class="form-select mb-1">
                                <option value="tersedia" {% if row.status == 'tersedia' %}selected{% endif %}>tersedia</option>
                                <option value="tidak_tersedia" {% if row.status == 'tidak_tersedia' %}selected{% endif %}>tidak_tersedia</option>
                            </select>
                            <textarea name="deskripsi" class="form-control mb-1" placeholder="Deskripsi"></textarea>
                            <button class="btn btn-sm btn-primary">Update</button>
                        </form>
                    </details>
                    <form method="post" action="{{ url_for('produk_delete', produk_id=row.id_produk) }}" class="mt-1" onsubmit="return confirm('Yakin hapus?')">
                        <button class="btn btn-sm btn-outline-danger">Hapus</button>
                    </form>
                </td>
            </tr>
        {% else %}
            <tr><td colspan="6" class="text-center text-muted">Belum ada data</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
